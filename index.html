<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Instant weather conditions for any city, with live temperature, humidity, wind and pressure." />
    <meta name="theme-color" content="#14385e" />
    <title>Weather</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M6.8 15h10.6a3.8 3.8 0 0 0 .4-7.58A5.3 5.3 0 0 0 7.5 5.7a4 4 0 0 0-.7 9.3Z' fill='none' stroke='%23eaf3f7' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="bg-overlay"></div>
    <div id="weather-animation"></div>
    <div id="grain" aria-hidden="true"></div>

    <main class="container">
      <section class="card" aria-label="Weather lookup">
        <header class="app-header">
          <div class="brand-lockup">
            <span class="brand-mark" aria-hidden="true">+</span>
            <div>
              <p class="app-title">Weather desk</p>
              <p class="app-subtitle">Live conditions, wherever you are</p>
            </div>
          </div>
          <span class="live-status"><span class="live-dot"></span>Live</span>
        </header>

        <div class="search-bar" role="search">
          <label class="sr-only" for="cityInput">Search for a city</label>
          <input
            type="text"
            id="cityInput"
            placeholder="Search a city"
            autocomplete="off"
          />
          <button id="searchBtn" aria-label="Search city">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"/>
              <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
          </button>
          <button id="locationBtn" aria-label="Use my location">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <circle cx="12" cy="12" r="3"/>
              <line x1="12" y1="2" x2="12" y2="5"/>
              <line x1="12" y1="19" x2="12" y2="22"/>
              <line x1="2" y1="12" x2="5" y2="12"/>
              <line x1="19" y1="12" x2="22" y2="12"/>
            </svg>
          </button>
        </div>

        <div id="loader" class="loader hidden" role="status" aria-label="Loading weather"></div>
        <div id="errorMsg" class="error hidden" role="alert"></div>

        <div id="weatherResult" class="weather-result hidden">
          <div class="weather-heading">
            <div>
              <p class="eyebrow">Current reading</p>
              <div class="location">
                <span id="cityName"></span>
                <span id="countryCode" class="country-badge"></span>
              </div>
            </div>
            <div class="weather-icon" id="weatherIcon" aria-hidden="true"></div>
          </div>

          <div class="reading">
            <div class="temperature">
              <span id="temp"></span>
              <span class="unit">°C</span>
            </div>
            <div class="description" id="weatherDesc"></div>
          </div>

          <div class="stats-grid">
            <div class="stat">
              <span class="stat-label">Feels Like</span>
              <span class="stat-value" id="feelsLike"></span>
            </div>
            <div class="stat">
              <span class="stat-label">Humidity</span>
              <span class="stat-value" id="humidity"></span>
            </div>
            <div class="stat">
              <span class="stat-label">Wind</span>
              <span class="stat-value" id="windSpeed"></span>
            </div>
            <div class="stat">
              <span class="stat-label">Pressure</span>
              <span class="stat-value" id="pressure"></span>
            </div>
          </div>
        </div>

        <footer class="card-footer">
          <span>OpenWeather signal</span>
          <span class="footer-rule"></span>
          <span>Metric / live</span>
        </footer>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
